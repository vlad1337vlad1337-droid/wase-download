# A missing URL keeps HTTP 404 and uses its locale (or the browser language).
map $http_accept_language $wase_error_language {
 default /en/404.html;
 ~*^ru /ru/404.html;
 ~*^zh /zh/404.html;
}
map $uri $wase_error_page {
 default $wase_error_language;
 ~^/ru/ /ru/404.html;
 ~^/en/ /en/404.html;
 ~^/zh/ /zh/404.html;
}
server {
 listen 80 default_server;
 listen [::]:80 default_server;
 server_name wase.download www.wase.download;
 root /var/www/wase-download/current;
 location /.well-known/acme-challenge/ { try_files $uri =404; }
 location / { return 301 https://wase.download$request_uri; }
}
server {
 listen 127.0.0.1:8443 ssl proxy_protocol;
 server_name wase.download www.wase.download;
 set_real_ip_from 127.0.0.1;
 real_ip_header proxy_protocol;
 root /var/www/wase-download/current;
 index index.html;
 ssl_certificate /etc/letsencrypt/live/wase.download/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/wase.download/privkey.pem;
 ssl_protocols TLSv1.2;
 ssl_session_cache shared:WaseTLS:10m;
 ssl_session_timeout 1h;
 ssl_session_tickets off;
 server_tokens off;
 client_max_body_size 100m;
 gzip on;
 gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header X-Frame-Options DENY always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://mc.yandex.ru; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https://mc.yandex.ru; connect-src 'self' https://mc.yandex.ru https://mc.yandex.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
 if ($host = www.wase.download) { return 301 https://wase.download$request_uri; }
 location /api/ {
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header Host $host;
  proxy_pass http://127.0.0.1:5189;
  proxy_read_timeout 195s;
  proxy_send_timeout 195s;
  proxy_request_buffering off;
 }
    error_page 404 $wase_error_page;
    location ~ ^/(en|ru|zh)/404\.html$ { internal; expires -1; }
 location /assets/ { expires 1y; try_files $uri =404; }
 # Font filenames contain their content identifier; CSS and HTML still revalidate.
 location ~ ^/fonts/[A-Za-z0-9_-]+\.woff2$ { expires 1y; try_files $uri =404; }
 location / { expires -1; try_files $uri $uri/ =404; }
 location ~ /\. { deny all; }
}
