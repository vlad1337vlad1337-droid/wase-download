# These limits apply to HTTP API requests only, never to the VPN stream.
limit_req_zone $binary_remote_addr zone=wase_api_ip:1m rate=3r/s;
limit_req_zone $server_name zone=wase_api_all:1m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=wase_api_connections:1m;
limit_conn_zone $server_name zone=wase_api_total:1m;
# A missing URL keeps HTTP 404 and uses its locale (or the browser language).
map $http_accept_language $wase_error_language {
 default /en/404.html;
 ~*^ru /ru/404.html;
 ~*^zh /zh/404.html;
 ~*^es /es/404.html;
 ~*^fr /fr/404.html;
 ~*^de /de/404.html;
 ~*^pt /pt/404.html;
 ~*^it /it/404.html;
 ~*^tr /tr/404.html;
 ~*^ja /ja/404.html;
 ~*^ko /ko/404.html;
 ~*^ar /ar/404.html;
 ~*^hi /hi/404.html;
}
map $uri $wase_error_page {
 default $wase_error_language;
 ~^/en/ /en/404.html;
 ~^/ru/ /ru/404.html;
 ~^/zh/ /zh/404.html;
 ~^/es/ /es/404.html;
 ~^/fr/ /fr/404.html;
 ~^/de/ /de/404.html;
 ~^/pt/ /pt/404.html;
 ~^/it/ /it/404.html;
 ~^/tr/ /tr/404.html;
 ~^/ja/ /ja/404.html;
 ~^/ko/ /ko/404.html;
 ~^/ar/ /ar/404.html;
 ~^/hi/ /hi/404.html;
}
server {
 listen 80 default_server;
 listen [::]:80 default_server;
 server_name wase.download www.wase.download;
 root /var/www/wase-download/current;
 location /.well-known/acme-challenge/ { try_files $uri =404; }
 location / { return 301 https://wase.download$request_uri; }
}
server {
 listen 127.0.0.1:8443 ssl proxy_protocol;
 server_name wase.download www.wase.download;
 set_real_ip_from 127.0.0.1;
 real_ip_header proxy_protocol;
 root /var/www/wase-download/current;
 index index.html;
 ssl_certificate /etc/letsencrypt/live/wase.download/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/wase.download/privkey.pem;
 ssl_protocols TLSv1.2;
 ssl_session_cache shared:WaseTLS:10m;
 ssl_session_timeout 1h;
 ssl_session_tickets off;
 server_tokens off;
 client_max_body_size 100m;
 gzip on;
 gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header X-Frame-Options DENY always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://mc.yandex.ru; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https://mc.yandex.ru; media-src 'self' blob:; connect-src 'self' https://mc.yandex.ru https://mc.yandex.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
 if ($host = www.wase.download) { return 301 https://wase.download$request_uri; }
 location = /api/mcp {
  limit_req zone=wase_api_ip burst=20 nodelay;
  limit_req zone=wase_api_all burst=40 nodelay;
  limit_req_status 429;
  limit_conn wase_api_connections 8;
  limit_conn wase_api_total 32;
  limit_conn_status 429;
  client_body_timeout 5s;
  client_max_body_size 16k;
  send_timeout 15s;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header Host $host;
  proxy_pass http://127.0.0.1:5189;
  proxy_read_timeout 10s;
  proxy_send_timeout 195s;
  proxy_request_buffering off;
  proxy_buffering off;
 }
 location /api/ {
  limit_req zone=wase_api_ip burst=20 nodelay;
  limit_req zone=wase_api_all burst=40 nodelay;
  limit_req_status 429;
  limit_conn wase_api_connections 8;
  limit_conn wase_api_total 32;
  limit_conn_status 429;
  client_body_timeout 15s;
  send_timeout 15s;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header Host $host;
  proxy_pass http://127.0.0.1:5189;
  proxy_read_timeout 195s;
  proxy_send_timeout 195s;
  proxy_request_buffering off;
  proxy_buffering off;
 }
    error_page 404 $wase_error_page;
    location ~ ^/(en|ru|zh|es|fr|de|pt|it|tr|ja|ko|ar|hi)/404\.html$ { internal; expires -1; }
 location /assets/ { expires 1y; try_files $uri =404; }
 # PDF.js uses a module worker; nosniff requires its JavaScript MIME type.
 location ~ ^/assets/[A-Za-z0-9_.-]+\.mjs$ {
  types { application/javascript mjs; }
  default_type application/javascript;
  expires 1y;
  try_files $uri =404;
 }
 # Font filenames contain their content identifier; CSS and HTML still revalidate.
 location ~ ^/fonts/[A-Za-z0-9_-]+\.woff2$ { expires 1y; try_files $uri =404; }
 location / { expires -1; try_files $uri $uri/ =404; }
 location ~ /\. { deny all; }
}
