name: Build and safety checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/discovery.test.mjs tests/seo.test.mjs tests/engine-order.test.mjs tests/branding-policy.test.mjs tests/boot.test.mjs
      - run: python3 tests/archive-security.py
      - run: python3 tests/output-validation.py
